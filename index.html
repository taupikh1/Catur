<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catur Ngawur</title>
<style>
:root{--bg:#f4efe6;--fg:#2b2118;--card:#fff;--l:#f0d9b5;--d:#b58863;--sel:#f6f669;--lm:rgba(255,215,0,.45);--chk:#ff5a5a;--ac:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bs:min(96vw,520px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1814;--fg:#f1e8da;--card:#2a241e;--l:#cdb88f;--d:#8a6a4a;--lm:rgba(255,215,0,.35)}}
:root[data-theme="dark"]{--bg:#1c1814;--fg:#f1e8da;--card:#2a241e;--l:#cdb88f;--d:#8a6a4a;--lm:rgba(255,215,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0 16px;min-height:100vh}
h1{font-size:1.25rem;margin:4px 0 0}
#badge{font-size:.75rem;opacity:.8}
.bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:var(--bs)}
select,button{font:inherit;font-size:.85rem;padding:7px 10px;border-radius:8px;border:1px solid rgba(128,128,128,.4);background:var(--card);color:var(--fg)}
button{cursor:pointer;font-weight:600}button:active{transform:scale(.96)}
#st{font-weight:700;min-height:1.4em;text-align:center}
#board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:var(--bs);height:var(--bs);border-radius:6px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.sq.l{background:var(--l)}.sq.d{background:var(--d)}
.sq.lm::before{content:"";position:absolute;inset:0;background:var(--lm)}
.sq.sel{background:var(--sel)}
.sq.chk{background:radial-gradient(circle,var(--chk),transparent 75%)}
.sq.mv::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.25)}
.sq.cap::after{width:92%;height:92%;background:none;border:4px solid rgba(0,0,0,.25)}
.p{position:absolute;inset:6%;z-index:1;pointer-events:none;display:flex}.p svg,.ghost svg,#promo svg{width:100%;height:100%;overflow:visible}
#spec{width:var(--bs);display:flex;justify-content:space-between;align-items:center;font-size:1.7rem;min-height:2.2rem}#spec span{display:inline-block}#spec.hop span{animation:hop .5s ease both}#spec.hop span:nth-child(even){animation-delay:.1s}#react{font-size:1.9rem}@keyframes hop{40%{transform:translateY(-10px) rotate(-8deg)}}
#bot{width:var(--bs);display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:8px 12px;min-height:58px}#av{font-size:2rem}#bn{font-size:.72rem;opacity:.75}#bb{font-size:.92rem;font-weight:600}#bb.pop{animation:bpop .35s}@keyframes bpop{0%{transform:scale(.92);opacity:0}100%{transform:none;opacity:1}}
.fly{position:fixed;z-index:40;pointer-events:none}.fly svg{width:88%;height:88%;margin:6%}
.sq.blink{animation:blk .45s 2}@keyframes blk{50%{filter:brightness(1.6)}}
.sq.chk .p{animation:shake .3s 4}@keyframes shake{25%{transform:translateX(-4px) rotate(-6deg)}75%{transform:translateX(4px) rotate(6deg)}}
.p.ko{transform:rotate(90deg) scale(.9);animation:none!important;opacity:.85}.p.ko::after{content:"💫";position:absolute;top:-4px;right:-2px;font-size:1.1rem}
body{transition:background-image .6s}
body.m-win{background-image:radial-gradient(circle at 50% 0,rgba(255,225,110,.4),transparent 65%)}
body.m-lose{background-image:linear-gradient(rgba(0,0,0,.32),rgba(0,0,0,.32))}
#board.m-win{box-shadow:0 0 26px 6px rgba(255,210,60,.65)}#board.m-lose{box-shadow:0 0 22px 4px rgba(200,40,40,.55)}
#board[data-h="w"].m-lose .p.w,#board[data-h="b"].m-lose .p.b{animation:sweat .5s infinite}@keyframes sweat{50%{transform:translate(1px,-2px)}}
body.hemat *{animation:none!important}
[hidden]{display:none!important}
#game{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
#menu{width:min(92vw,420px);display:flex;flex-direction:column;gap:12px;padding-top:5vh}
#menu h1{font-size:1.9rem;text-align:center;margin:0}.sub{text-align:center;margin:0;opacity:.75}
#modes,#setup{display:flex;flex-direction:column;gap:10px}
.mc{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px 16px;border-radius:14px;font-size:1.05rem;text-align:left;width:100%}.mc small{font-weight:400;opacity:.75;font-size:.8rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);padding:10px 12px;border-radius:12px}.row select{flex:1;max-width:60%}
#go{background:var(--ac);color:#fff;font-size:1.05rem;padding:13px;border:0}
#res{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100}#res>div{background:var(--card);padding:22px;border-radius:16px;text-align:center;display:flex;flex-direction:column;gap:10px;min-width:240px}#rt{font-size:1.4rem;font-weight:800}
.sq.hint{box-shadow:inset 0 0 0 4px #2ecc71}
#game[data-m="bot"] #un,#game[data-m="bot"] #hn,#game[data-m="duo"] #hn{display:none}
#clocks{width:var(--bs);justify-content:space-between;gap:8px}#clocks span{flex:1;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;background:var(--card);border-radius:10px;padding:6px}#clocks .on{outline:3px solid var(--ac)}#clocks .low{color:#e74c3c}
.p{transition:opacity .25s}#board.blind:not(.peek) .p{opacity:0}#pk{display:none}#game[data-v="blind"] #pk{display:inline-block}#game[data-v="blind"] #mv{visibility:hidden}
.mc:disabled{opacity:.45}
#game[data-m="boss"] #un,#game[data-m="boss"] #hn,#game[data-m="ngawur"] #un,#game[data-m="ngawur"] #hn,#game[data-m="puz"] #un,#game[data-m="puz"] #dr,#game[data-m="puz"] #rs{display:none}
#bosslist{display:flex;flex-direction:column;gap:10px}#bosslist[hidden]{display:none}#bl{display:flex;flex-direction:column;gap:8px}
#rv{position:fixed;inset:0;background:var(--bg);z-index:120;overflow:auto;display:none;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 24px}
.rvc{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:8px}#rv .bar{width:100%}
#rb{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:min(92vw,420px);height:min(92vw,420px);border-radius:6px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.35)}
#rvt{font-weight:800}#rvm{min-height:2.8em;text-align:center;font-weight:600;white-space:pre-line}#rvs{font-size:.85rem;text-align:center}#rvg{width:100%}
#pgn{width:100%;border-radius:8px;border:1px solid rgba(128,128,128,.4);background:var(--card);color:var(--fg);padding:8px;font:inherit;font-size:.8rem}
#game[data-m="puz"] #rvb{display:none}
#game[data-m="quick"] #un,#game[data-m="quick"] #hn{display:none}
#sv{position:fixed;inset:0;background:var(--bg);z-index:130;overflow:auto;display:none;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 24px}#sv .bar{width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px + var(--i,0)*48px);background:#222;color:#fff;padding:10px 14px;border-radius:12px;z-index:200;font-weight:600;font-size:.85rem;max-width:90vw;text-align:center;animation:bpop .3s}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-60%);width:calc(var(--bs)/8*1.1);height:calc(var(--bs)/8*1.1)}
#mv{width:var(--bs);max-height:84px;overflow:auto;background:var(--card);border-radius:8px;padding:8px 10px;font-size:.8rem;line-height:1.5}
#promo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100}
#promo div{background:var(--card);padding:14px;border-radius:12px;display:flex;gap:8px}
#promo button{padding:6px;width:64px;height:64px}
button{border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
#menu{padding-top:3vh;gap:14px}#menu h1{font-size:2rem}
#modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{grid-column:1/-1;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.55;margin-top:4px}
#modes .mc{align-items:center;text-align:center;gap:4px;padding:14px 8px;min-height:116px;justify-content:center;border:1px solid rgba(128,128,128,.25)}
#modes .mc .ic{font-size:2rem;line-height:1}#modes .mc b{font-size:.95rem}
#modes .mc small{font-size:.7rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#setup h3{font-size:1.2rem;text-align:center}
#adv{background:var(--card);border-radius:12px;padding:10px 12px}#adv summary{cursor:pointer;font-weight:700;font-size:.9rem}
#adv .row{padding:8px 0;border-radius:0;background:none;border-top:1px solid rgba(128,128,128,.2);margin-top:8px}
#bk,#bk2{background:none;border:0;box-shadow:none;opacity:.7}
.tb{display:flex;gap:6px;justify-content:center;width:var(--bs)}.tb button{flex:1;max-width:52px;padding:9px 0;font-size:1.1rem;line-height:1}
#acts{gap:8px}#acts button{flex:1}
#game>h1{display:none}#game[data-m="puz"] #acts{display:none}
#res button{width:100%;padding:11px}#ra{background:var(--ac);color:#fff;border:0}
</style>
</head>
<body>
<div id="menu"><h1>♟ Catur Ngawur</h1><p class="sub">Pilih mode main</p>
<div id="modes">
<button class="mc" data-m="bot"><b>🤖 Lawan Bot</b><small>Pilih level dan warna, dari bocah sampai GM</small></button>
<button class="mc" data-m="duo"><b>👥 Main Berdua</b><small>Dua pemain gantian di satu layar</small></button>
<button class="mc" data-m="santai"><b>😌 Mode Santai</b><small>Undo tanpa batas dan hint dari engine</small></button>
<button class="mc" data-m="puz"><b>🧩 Puzzle Harian</b><small>3 soal skakmat, ganti tiap hari</small></button>
<button class="mc" data-m="ngawur"><b>🤪 Mode Ngawur</b><small>Kejadian konyol acak tiap beberapa langkah</small></button>
<button class="mc" data-m="boss"><b>👑 Tantangan Bos</b><small>Kalahkan 6 bos satu per satu</small></button>
<button class="mc" data-m="imp"><b>📂 Impor / Ulang PGN</b><small>Tempel PGN, putar ulang, dan analisis</small></button>
<button class="mc" data-m="quick"><b>⚡ Skakmat Cepat</b><small>Menang secepat mungkin, skor dihitung</small></button>
<button class="mc" data-m="stat"><b>📈 Statistik & Pencapaian</b><small>Rekor, streak, dan koleksi</small></button></div>
<div id="setup" hidden><h3 id="stt" style="margin:0"></h3>
<div class="row" id="r-lv"><span>Level bot</span></div><div class="row" id="r-sd"><span>Warna</span></div><details id="adv"><summary>⚙️ Pengaturan lanjutan</summary>
<div class="row" id="r-th"><span>Tema papan</span></div>
<div class="row" id="r-sk"><span>Karakter bidak</span><select id="skn"></select></div>
<div class="row" id="r-tm"><span>Waktu</span><select id="tm"><option value="0">Tanpa jam</option><option value="60,0">Bullet 1 menit</option><option value="180,2">Blitz 3+2</option><option value="300,0">Blitz 5 menit</option><option value="600,5">Rapid 10+5</option></select></div>
<div class="row" id="r-vr"><span>Varian</span><select id="vrn"><option value="std">Standar</option><option value="960">Chess960 (tanpa rokade)</option><option value="hq">Handicap: bot tanpa ratu</option><option value="hr">Handicap: bot tanpa benteng</option><option value="hn">Handicap: bot tanpa kuda</option><option value="blind">Mode Buta</option></select></div>
<div class="row" id="r-an"><span>Animasi</span><button id="an">✨ Penuh</button></div></details>
<button id="go">▶ Mulai Main</button><button id="bk">← Kembali</button></div>
<div id="bosslist" hidden><h3 style="margin:0">👑 Tantangan Bos</h3><div id="bl"></div><button id="bk2">← Kembali</button></div></div>
<div id="game" hidden>
<h1>♟ Catur Ngawur</h1>
<div id="badge">Memuat Stockfish…</div>
<div class="bar">
<select id="lv"></select>
<select id="side"><option value="w">Main Putih</option><option value="b">Main Hitam</option></select>
<select id="th"></select>
</div>
<div class="tb"><button id="mn" title="Menu">☰</button><button id="nw" title="Baru">🔄</button><button id="fl" title="Putar papan">🔃</button><button id="un" title="Undo">↩️</button><button id="hn" title="Hint">💡</button><button id="pk" title="Intip">👁</button><button id="rvb" title="Analisis">📊</button><button id="mu">🔊</button></div><div class="bar" id="acts"><button id="dr">🤝 Remis</button><button id="rs">🏳️ Menyerah</button></div>
<div id="st"></div>
<div id="bot"><div id="av"></div><div><b id="bn"></b><div id="bb"></div></div></div>
<div id="spec"></div>
<div id="clocks" style="display:none"><span id="cb"></span><span id="cw"></span></div>
<div id="board"></div>
<div id="mv"></div>
</div>
<div id="res"><div><div id="rt"></div><div id="rvl"></div><button id="ra">Main Lagi</button><button id="rva">📊 Analisis & Ulang</button><button id="rm">Menu</button></div></div>
<div id="sv"><div class="rvc"><h3 style="margin:0">📈 Statistik & Pencapaian</h3><div id="svb" style="width:100%;font-size:.9rem;line-height:1.5"></div><div class="bar"><button id="svr">Reset data</button><button id="svx">Tutup</button></div></div></div>
<div id="rv"><div class="rvc"><div id="rvt">Ulang Partai</div><div id="rb"></div><div id="rvm"></div>
<div class="bar"><button id="rv0">⏮</button><button id="rv1">◀</button><button id="rv2">▶</button><button id="rv3">⏭</button><button id="rv4">▶▶ Putar</button></div>

<div class="bar"><button id="rvan">🔍 Analisis</button><button id="rvp">📋 Salin PGN</button><button id="rvi">📥 Impor PGN</button><button id="rvx">Tutup</button></div>
<textarea id="pgn" rows="5" hidden placeholder="Tempel PGN di sini"></textarea></div></div>
<div id="promo"><div></div></div>

function genPuz(seed,dep){
 const R=mb(seed),T=new Chess(),t0=Date.now(),lim=dep===2?2500:2000;
 while(Date.now()-t0<lim){
  T.reset();const n=16+(R()*34|0);let ok=true;
  for(let i=0;i<n;i++){const ms=T.moves();if(!ms.length){ok=false;break}T.move(ms[R()*ms.length|0])}
  if(!ok||T.game_over())continue;
  const fen=T.fen(),s=m1(T);
  if(dep===1){if(s.length>=1&&s.length<=2)return{fen,dep:1,sol:s.map(m=>m.from+m.to)};continue}
  if(s.length)continue;
  const good=[];
  for(const m of T.moves({verbose:true})){
   T.move(m.san);
   if(T.in_check()&&!T.game_over()){const rs=T.moves();if(rs.length&&rs.every(r=>{T.move(r);const k=m1(T).length>0;T.undo();return k}))good.push(m.from+m.to)}
   T.undo();
  }
  if(good.length>=1&&good.length<=2)return{fen,dep:2,sol:good};
 }
 return null;
}

function tryMove(from,to){
  if(G.moves({square:from,verbose:true}).some(m=>m.to===to&&m.promotion)){
    const d=$('promo').firstElementChild;
    d.innerHTML=['q','r','b','n'].map(x=>`<button data-p="${x}">${pcs(x,human)}</button>`).join('');
    d.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;$('promo').style.display='none';doMove({from,to,promotion:b.dataset.p})};
    $('promo').style.display='flex';
  }else doMove({from,to});
}
function doMove(m){
  const r=G.move(m);if(!r)return;
  last=[r.from,r.to];sel=null;legal=[];after();
}
function after(){
  if(clkOn){const n=Date.now(),mv=G.turn()==='w'?'b':'w';clk[mv]=Math.max(0,clk[mv]-(n-lastT))+inc;lastT=n}
  peek(1000);
  if(mode==='puz'){render();reactMove();puzAfter();return}
  if(mode==='duo'){human=G.turn();flip=human==='b'}
  render();
  reactMove();
  if(!over&&G.turn()!==human)botMove();
}

// ===== Bot =====
function botMove(){
  busy=true;status();react('think');
  if(eng==='wait'){setTimeout(botMove,400);return}
  setTimeout(()=>{if((mode==='boss'&&Math.random()<BOSS[bossIdx].q)||sleepy){sleepy=false;qMove()}else eng==='sf'?sfGo():fbMove()},250);
}
function sfGo(){
  const L=LV[level];sfId=gid;
  engine.postMessage('setoption name Skill Level value '+L[0]);engine.postMessage('setoption name UCI_Chess960 value '+(vr==='960'));
  engine.postMessage('position fen '+G.fen());
  let mt=L[2];if(clkOn)mt=Math.max(60,Math.min(mt,clk[human==='w'?'b':'w']/30));engine.postMessage('go depth '+L[1]+' movetime '+Math.round(mt));
}
function applyUci(u){
  if(anaSwallow){anaSwallow=false;return}if(anaCb){const f=anaCb;anaCb=null;f();return}if(hintReq){hintReq=false;showHint(u);return}if(!busy||sfId!==gid)return;judge();
  const m={from:u.slice(0,2),to:u.slice(2,4)};if(u[4])m.promotion=u[4];
  const r=G.move(m);
  if(!r)return fbMove();
  busy=false;last=[r.from,r.to];after();
}
function initSF(){
  try{
    const w=new Worker(URL.createObjectURL(new Blob(["importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js')"],{type:'text/javascript'})));
    let ready=false;
    const fail=()=>{try{w.terminate()}catch(e){}setEng('fb')};
    const to=setTimeout(()=>{if(!ready)fail()},10000);
    w.onerror=()=>{if(!ready)fail();else{setEng('fb');if(busy)fbMove()}};
    w.onmessage=e=>{
      const l=String(e.data);
      if(l==='uciok')w.postMessage('isready');
      else if(l==='readyok'&&!ready){ready=true;clearTimeout(to);engine=w;setEng('sf')}
      else if(anaCb&&l.startsWith('info')&&l.includes(' score ')){const m=l.match(/score (cp|mate) (-?\d+)/);if(m)anaS=(m[1]==='cp'?+m[2]:(m[2]>0?3000:-3000))}
      else if(l.startsWith('info')&&!hintReq&&l.includes(' score ')){const m=l.match(/score (cp|mate) (-?\d+)/);if(m)cpH=-(m[1]==='cp'?+m[2]:(m[2]>0?3000:-3000))}
      else if(l.startsWith('bestmove'))applyUci(l.split(' ')[1]);
    };
    w.postMessage('uci');
  }catch(e){setEng('fb')}
}

// ===== Engine cadangan: minimax + alpha-beta =====
const VAL={p:100,n:320,b:330,r:500,q:900,k:0};
function ev(){
  const b=(window.EVG||G).board();let s=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=b[r][c];if(!p)continue;
    let v=VAL[p.type];
    if(p.type!=='k'&&p.type!=='r')v+=(7-Math.abs(3.5-c)-Math.abs(3.5-r))*4;
    if(p.type==='p')v+=(p.color==='w'?7-r:r)*8;
    s+=p.color==='w'?v:-v;
  }
  return s;
}
function srch(d,a,b){
  const w=G.turn()==='w';
  if(d===0)return ev();
  const ms=G.moves({verbose:true});
  if(!ms.length)return G.in_check()?(w?-99999:99999):0;
  ms.sort((x,y)=>(y.captured?1:0)-(x.captured?1:0));
  let best=w?-Infinity:Infinity;
  for(const m of ms){
    G.move(m.san);const s=srch(d-1,a,b);G.undo();
    if(w){best=Math.max(best,s);a=Math.max(a,s)}else{best=Math.min(best,s);b=Math.min(b,s)}
    if(b<=a)break;
  }
  return best;
}
function fbMove(){
  const id=gid;
  setTimeout(()=>{
    if(id!==gid)return;
    const ms=G.moves({verbose:true});if(!ms.length)return;
    const [dp,rnd]=FB[level];let pick;
    if(Math.random()<rnd)pick=ms[Math.random()*ms.length|0];
    else{
      const w=G.turn()==='w';let bs=w?-Infinity:Infinity;ms.sort(()=>Math.random()-.5);
      for(const m of ms){G.move(m.san);const s=srch(dp-1,-Infinity,Infinity);G.undo();if(w?s>bs:s<bs){bs=s;pick=m}}
    }
    judge();const r=G.move(pick.san);busy=false;last=[r.from,r.to];after();
  },50);
}

// ===== Kontrol =====
function newGame(){
  if(mode==='puz'){puzStart(pzIdx);return}
  gid++;cpH=null;prevS=null;lastDrop=0;G.reset();sel=null;legal=[];last=null;busy=false;
  human=mode==='duo'?'w':$('side').value;level=+$('lv').value;flip=human==='b';hintReq=false;over=false;document.getElementById('res').style.display='none';setupPos();clockInit();startFen=G.fen();hintLog=[];qT=Date.now();
  render();mood();botUI();if(mode==='duo'){document.getElementById('bot').style.display='none'}else{document.getElementById('bot').style.display='';say('start')}if(human==='b'&&mode!=='duo')botMove();
}
$('nw').onclick=newGame;
$('fl').onclick=()=>{flip=!flip;render()};
$('lv').onchange=()=>{level=+$('lv').value;botUI();say('start')};
$('side').onchange=()=>{};
$('un').onclick=()=>{
  if(busy)return;
  G.undo();if(mode==='duo'){human=G.turn();flip=human==='b'}else if(G.turn()!==human)G.undo();
  const h=G.history({verbose:true}),l=h[h.length-1];
  last=l?[l.from,l.to]:null;sel=null;legal=[];render();
};
buildTheme();buildSkin();prefs();render();botUI();initSF();menuInit();
